services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # HuggingFace 캐시(컨테이너 재시작해도 모델 재다운로드 방지)
      - HF_HOME=/cache/hf
      - TRANSFORMERS_CACHE=/cache/hf/transformers
      - SENTENCE_TRANSFORMERS_HOME=/cache/hf/sentence-transformers
      # CPU 최적화(요약은 1개 동시 처리 권장)
      - SUM_MAX_CONCURRENCY=1
      - CACHE_TTL_SEC=1800
      - CACHE_MAX_ITEMS=256
      # Ollama (host의 Ollama 컨테이너, 포트 11435)
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
      - OLLAMA_MODEL=qwen3.5:latest
      # FE가 같은 서버에서 서빙되므로 빈 문자열(동일 오리진)
      - API_BASE=
    volumes:
      - hf-cache:/cache
    restart: unless-stopped

volumes:
  hf-cache:
